
version: '3.8'

services:
  app:
    build: .  # Build from Dockerfile in current directory
    image: basic_node_app:v3
    container_name: basic_node_app_v3_container
    ports:
      - "8002:6001"  # Host:Container port mapping
    volumes:
      - ./uploads:/var/www/basic_node_app/uploads  # Bind mount for uploads
    networks:
      - basic_node_app_network
    depends_on:
      - mongodb  # Ensure MongoDB starts first
    # Add environment variables if needed:
    # environment:
    #   - MONGO_URL=mongodb://mongodb:27017/mydb

  mongodb:
    image: mongo
    container_name: basic_node_app_mongodb_container
    ports:
      - "28017:27017"  # Host:Container port mapping
    networks:
      - basic_node_app_network
    # Add persistent storage for MongoDB data:
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:  # Named volume for MongoDB persistence

networks:
  basic_node_app_network:  # Custom network
    driver: bridge